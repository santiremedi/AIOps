apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: pharmago
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
      prometheus:
        config:
          scrape_configs:
            - job_name: 'node-exporter'
              scrape_interval: 5s
              static_configs:
                - targets: ['node-exporter:9100']

            - job_name: 'kube-state-metrics'
              scrape_interval: 5s
              static_configs:
                - targets: ['kube-state-metrics:8080']

            - job_name: 'kubernetes-cadvisor'
              scrape_interval: 5s
              kubernetes_sd_configs:
                - role: node
              scheme: https
              tls_config:
                ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              relabel_configs:
                - action: labelmap
                  regex: __meta_kubernetes_node_label_(.+)
                - target_label: __address__
                  replacement: kubernetes.default.svc:443
                # "$$" escapa el "$" para que el collector no lo expanda como variable de entorno.
                - source_labels: [__meta_kubernetes_node_name]
                  regex: (.+)
                  target_label: __metrics_path__
                  replacement: /api/v1/nodes/$${1}/proxy/metrics/cadvisor
                - source_labels: [__meta_kubernetes_node_name]
                  target_label: node
              # Con el driver docker de minikube, cAdvisor ve cada cgroup también bajo /docker/<nodo>/
              # y duplicaría la CPU, la memoria y la red de cada pod al sumar.
              metric_relabel_configs:
                - source_labels: [id]
                  regex: /docker/.+
                  action: drop

      # cAdvisor no publica el storage por contenedor con containerd ni las escrituras con cgroup v1;
      # el kubelet sí informa el storage efímero de cada pod. Se crea un receiver por nodo.
      receiver_creator/kubelet:
        watch_observers: [k8s_observer]
        receivers:
          kubeletstats:
            rule: type == "k8s.node"
            config:
              auth_type: serviceAccount
              endpoint: "`endpoint`:`kubelet_endpoint_port`"
              insecure_skip_verify: true
              collection_interval: 10s
              metric_groups: [pod]

    extensions:
      k8s_observer:
        auth_type: serviceAccount
        observe_nodes: true
        observe_pods: false

    processors:
      filter/pod_storage:
        metrics:
          include:
            match_type: strict
            metric_names: [k8s.pod.filesystem.usage]
      transform/pod_labels:
        metric_statements:
          - context: datapoint
            statements:
              - set(attributes["pod"], resource.attributes["k8s.pod.name"])
              - set(attributes["namespace"], resource.attributes["k8s.namespace.name"])

    exporters:
      prometheus:
        endpoint: "0.0.0.0:8889"
      otlp_grpc/jaeger:
        endpoint: "jaeger:4317"
        tls:
          insecure: true
      debug: {}

    service:
      extensions: [k8s_observer]
      pipelines:
        metrics:
          receivers: [otlp, prometheus]
          exporters: [prometheus, debug]
        metrics/pod_storage:
          receivers: [receiver_creator/kubelet]
          processors: [filter/pod_storage, transform/pod_labels]
          exporters: [prometheus]
        traces:
          receivers: [otlp]
          exporters: [otlp_grpc/jaeger, debug]
