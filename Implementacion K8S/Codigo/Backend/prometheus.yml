global:
  scrape_interval: 5s

scrape_configs:
  # El collector es el único target: reexporta las métricas OTLP de los servicios.
  # honor_labels conserva el job e instance de origen en lugar de los del collector.
  - job_name: 'otlp-collector'
    honor_labels: true
    metrics_path: /metrics
    static_configs:
      - targets: ['otlp-collector:8889']
